# ZOMBIE ATTACK — CI: тесты + сборка нативного .exe для Windows.
#
# Что делает:
#  1. ubuntu: gradlew build (компиляция + headless-тесты)
#  2. windows: gradlew packageDist -> jpackage собирает
#     ZombieAttack.exe (app-image с встроенной JRE) и кладёт в dist/
#  3. Артефакт "ZombieAttack-windows-exe" в разделе Actions
#     и (при наличии прав) релиз v1.0.0 с zip-архивом игры.
#  Диагностика: при падении сборки лог публикуется комментарием
#  к коммиту (удобно смотреть через API, когда логи Actions недоступны).
name: CI Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Сборка и тесты (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Gradle build + test
        id: build
        continue-on-error: true
        run: ./gradlew clean build --no-daemon --console=plain > build-log.txt 2>&1; T=$?; tail -40 build-log.txt; exit $T
      - name: Лог сборки — комментарием к коммиту
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(tail -c 50000 build-log.txt | sed 's/```/~~~ /g')
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="**CI: Gradle build провалился** (Linux job). Хвост лога:
          \`\`\`
          $TAIL
          \`\`\`" >/dev/null
      - name: Итоговый статус сборки
        if: steps.build.outcome == 'failure'
        run: exit 1

  smoke:
    name: Smoke-тест запуска (Linux xvfb)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Виртуальный дисплей и библиотеки
        run: >
          sudo apt-get update &&
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libxrandr2
          libxcursor1 libxi6 libxinerama1 libopenal1
      - name: Сборка installDist
        run: >
          ./gradlew installDist --no-daemon --console=plain > smoke-gradle.txt 2>&1;
          T=$?; tail -30 smoke-gradle.txt; exit $T
      - name: Запуск игры на 25 секунд
        id: run
        continue-on-error: true
        run: |
          set +e
          # za.audio=false: на runner'е нет звукового устройства —
          # OpenAL-инициализация падает NPE внутри jME (alcOpenDevice -> null)
          JAVA_OPTS="-Dza.audio=false" timeout 25 xvfb-run -a -s "-screen 0 1280x720x24" \
            build/install/zombie-attack/bin/zombie-attack > app-smoke.txt 2>&1
          CODE=$?
          echo "Код выхода: $CODE (124 = игра работала и была остановлена по таймауту — успех)"
          if [ "$CODE" = "124" ]; then exit 0; else exit 1; fi
      - name: В логе игры не должно быть ошибок
        id: logcheck
        if: always()
        run: |
          # безвредный шум headless-среды: нет аудио-устройства/AL-библиотек
          # (|| true: отсутствие совпадений у grep — это успех, а не ошибка)
          BAD=$( (grep -nE "SEVERE|Exception" app-smoke.txt || true) | (grep -viE "openal|audio|AL lib|sound|audioDevice" || true) )
          if [ -n "$BAD" ]; then
            echo "=== Обнаружены ошибки в логе игры ==="
            echo "$BAD" | head -20
            exit 1
          fi
      - name: Лог запуска — комментарием к коммиту
        if: always() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(tail -c 40000 app-smoke.txt | sed 's/```/~~~ /g')
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="**CI: игра упала при запуске** (smoke, xvfb). Хвост лога:
          \`\`\`
          $TAIL
          \`\`\`" >/dev/null
      - name: Плохие строки лога — комментарием к коммиту
        if: always() && steps.logcheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BAD=$( (grep -n -A18 -B2 -E "SEVERE|Exception" app-smoke.txt || true) | (grep -viE "openal|audio|AL lib|sound|audioDevice" || true) | head -60)
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="**CI: ошибки в логе игры** (smoke, xvfb):
          \`\`\`
          $BAD
          \`\`\`" >/dev/null
      - name: Итоговый статус smoke
        if: always() && (steps.run.outcome == 'failure' || steps.logcheck.outcome == 'failure')
        run: exit 1

  exe:
    name: Нативный .exe (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: jpackage -> dist/ZombieAttack/ZombieAttack.exe
        id: pkg
        continue-on-error: true
        shell: bash
        run: ./gradlew packageDist --no-daemon --console=plain > pkg-log.txt 2>&1; T=$?; tail -40 pkg-log.txt; exit $T
      - name: Лог пакета — комментарием к коммиту
        if: steps.pkg.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAIL=$(tail -c 50000 pkg-log.txt | sed 's/```/~~~ /g')
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="**CI: packageDist провалился** (Windows job). Хвост лога:
          \`\`\`
          $TAIL
          \`\`\`" >/dev/null
      - name: Итоговый статус пакета
        if: steps.pkg.outcome == 'failure'
        run: exit 1
      - name: Архивировать результат
        run: |
          Compress-Archive -Path dist/ZombieAttack -DestinationPath ZombieAttack-windows.zip -Force
        shell: pwsh
      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ZombieAttack-windows-exe
          path: ZombieAttack-windows.zip
      - name: Приложить к релизу v1.0.0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 --title "ZOMBIE ATTACK v1.0.0" \
              --notes "Готовая Windows-сборка: ZombieAttack.exe (jpackage app-image, JRE внутри). Распакуйте zip и запустите ZombieAttack.exe."
          gh release upload v1.0.0 ZombieAttack-windows.zip --clobber
